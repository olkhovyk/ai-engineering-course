services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: lesson10-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: lesson10-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: lesson10-phoenix
    ports:
      - "6006:6006"
      - "4317:4317"
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
    volumes:
      - phoenix_data:/mnt/data

volumes:
  qdrant_data:
  redis_data:
  phoenix_data:
