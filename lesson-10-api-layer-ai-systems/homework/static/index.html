<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lesson 10 RAG API</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --line: #d9dee7;
      --text: #18202d;
      --muted: #687385;
      --accent: #0f766e;
      --accent-dark: #115e59;
      --danger: #b42318;
      --code: #eef2f7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .shell {
      display: grid;
      grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
      min-height: 100vh;
    }

    aside {
      border-right: 1px solid var(--line);
      background: #fbfcfd;
      padding: 20px;
    }

    main {
      padding: 20px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 16px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 22px;
      font-weight: 700;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 14px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 11px;
      font: inherit;
      color: var(--text);
      background: var(--panel);
    }

    textarea {
      min-height: 92px;
      resize: vertical;
      line-height: 1.45;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      padding: 9px 12px;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      min-height: 38px;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    button.primary:hover {
      background: var(--accent-dark);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
    }

    .chat-output {
      min-height: 220px;
      height: 420px;
      overflow: auto;
      white-space: pre-wrap;
      line-height: 1.55;
      font-size: 16px;
      resize: vertical;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(120px, 1fr));
      gap: 8px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      background: #fbfcfd;
      min-height: 66px;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .metric strong {
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    pre {
      margin: 0;
      padding: 12px;
      background: var(--code);
      border-radius: 6px;
      overflow: auto;
      min-height: 120px;
      height: 220px;
      max-height: 520px;
      font-size: 12px;
      line-height: 1.45;
      resize: vertical;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .debug-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .debug-header h2 {
      margin: 0;
    }

    .debug-panel[hidden] {
      display: none;
    }

    .status {
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
      margin-top: 10px;
    }

    .error {
      color: var(--danger);
    }

    @media (max-width: 900px) {
      .shell {
        grid-template-columns: 1fr;
      }

      aside {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .meta-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <h1>Lesson 10 RAG API</h1>

      <label for="apiKey">API key</label>
      <input id="apiKey" value="demo-free-key" autocomplete="off" />

      <label for="message">Question</label>
      <textarea id="message">Where should application config be stored?</textarea>

      <div class="actions">
        <button class="primary full" id="sendBtn">Send streaming request</button>
        <button id="healthBtn">Health</button>
        <button id="usageBtn">Usage</button>
        <button id="breakdownBtn">Breakdown</button>
        <button id="clearCacheBtn">Clear cache</button>
        <button class="full" id="cacheStatusBtn">Cache status</button>
        <button class="full" id="configBtn">Debug config</button>
      </div>

      <div class="status" id="status">Ready</div>
    </aside>

    <main>
      <section class="meta-grid">
        <div class="metric"><span>Cache</span><strong id="cacheHit">-</strong></div>
        <div class="metric"><span>Similarity</span><strong id="similarity">-</strong></div>
        <div class="metric"><span>Model</span><strong id="model">-</strong></div>
        <div class="metric"><span>Latency</span><strong id="latency">-</strong></div>
        <div class="metric"><span>TTFT</span><strong id="ttft">-</strong></div>
        <div class="metric"><span>Sources</span><strong id="sources">-</strong></div>
      </section>

      <section class="panel chat-output" id="answer"></section>

      <section class="panel">
        <div class="debug-header">
          <h2>Last response</h2>
          <button id="toggleLogBtn">Show stream log</button>
        </div>
        <pre id="debug">{}</pre>
        <div class="debug-panel" id="streamPanel" hidden>
          <h2 style="margin-top: 14px;">Full stream log</h2>
          <pre id="streamLog"></pre>
        </div>
      </section>
    </main>
  </div>

  <script>
    const apiKey = document.getElementById("apiKey");
    const message = document.getElementById("message");
    const sendBtn = document.getElementById("sendBtn");
    const statusEl = document.getElementById("status");
    const answer = document.getElementById("answer");
    const debug = document.getElementById("debug");
    const streamLog = document.getElementById("streamLog");
    const streamPanel = document.getElementById("streamPanel");
    const toggleLogBtn = document.getElementById("toggleLogBtn");
    const cacheHit = document.getElementById("cacheHit");
    const model = document.getElementById("model");
    const similarity = document.getElementById("similarity");
    const latency = document.getElementById("latency");
    const ttft = document.getElementById("ttft");
    const sources = document.getElementById("sources");

    function headers() {
      return {
        "Content-Type": "application/json",
        "X-API-Key": apiKey.value.trim(),
      };
    }

    function setStatus(text, isError = false) {
      statusEl.textContent = text;
      statusEl.classList.toggle("error", isError);
    }

    function resetOutput() {
      answer.textContent = "";
      debug.textContent = "{}";
      streamLog.textContent = "";
      cacheHit.textContent = "-";
      model.textContent = "-";
      similarity.textContent = "-";
      latency.textContent = "-";
      ttft.textContent = "-";
      sources.textContent = "-";
    }

    async function sendChat() {
      resetOutput();
      sendBtn.disabled = true;
      setStatus("Streaming...");

      try {
        const response = await fetch("/chat/stream", {
          method: "POST",
          headers: headers(),
          body: JSON.stringify({ message: message.value }),
        });

        if (!response.ok) {
          throw new Error(`${response.status} ${await response.text()}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split("\n\n");
          buffer = parts.pop() || "";

          for (const part of parts) {
            const line = part.split("\n").find((item) => item.startsWith("data: "));
            if (!line) continue;

            const event = JSON.parse(line.slice(6));
            debug.textContent = JSON.stringify(event, null, 2);
            streamLog.textContent += JSON.stringify(event) + "\n";

            if (event.type === "token") {
              answer.textContent += event.content;
            }

            if (event.type === "done") {
              cacheHit.textContent = String(event.cache_hit);
              similarity.textContent = event.cache_similarity == null ? "-" : event.cache_similarity.toFixed(4);
              model.textContent = event.model || "-";
              latency.textContent = `${event.latency_ms} ms`;
              ttft.textContent = `${event.ttft_ms} ms`;
              sources.textContent = (event.sources || []).join(", ");
              setStatus("Done");
            }

            if (event.type === "error") {
              setStatus(event.message, true);
            }
          }
        }
      } catch (error) {
        setStatus(error.message, true);
      } finally {
        sendBtn.disabled = false;
      }
    }

    async function callJson(path, method = "GET") {
      setStatus(`Calling ${path}...`);
      const response = await fetch(path, { method, headers: headers() });
      const payload = await response.json();
      debug.textContent = JSON.stringify(payload, null, 2);
      setStatus(response.ok ? "Done" : "Request failed", !response.ok);
    }

    sendBtn.addEventListener("click", sendChat);
    document.getElementById("healthBtn").addEventListener("click", () => callJson("/health"));
    document.getElementById("usageBtn").addEventListener("click", () => callJson("/usage/today"));
    document.getElementById("breakdownBtn").addEventListener("click", () => callJson("/usage/breakdown"));
    document.getElementById("clearCacheBtn").addEventListener("click", () => callJson("/cache/clear", "POST"));
    document.getElementById("cacheStatusBtn").addEventListener("click", () => callJson("/cache/status"));
    document.getElementById("configBtn").addEventListener("click", () => callJson("/debug/config"));
    toggleLogBtn.addEventListener("click", () => {
      streamPanel.hidden = !streamPanel.hidden;
      toggleLogBtn.textContent = streamPanel.hidden ? "Show stream log" : "Hide stream log";
    });
  </script>
</body>
</html>
